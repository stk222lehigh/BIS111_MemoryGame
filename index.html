<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match</title>
  <style>
    /* ===== Theme colors =====
       Kept as variables so a dark theme only has to swap the values. */
    :root {
      --bg: #f4f1ea;
      --text: #1b1b1b;
      --card-back: #2b4c7e;
      --card-face: #ffffff;
      --accent: #e07a1f;
      --focus: #ffbf00;
      --matched: #d8f0d2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --text: #f2f2f2;
        --card-back: #3d6bb3;
        --card-face: #2a2d35;
        --accent: #ffa64d;
        --matched: #24452a;
      }
    }

    /* ===== Base layout =====
       Large default font so it's readable from the back of the room. */
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: 20px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      margin: 0.2em 0;
      font-size: 2.2rem;
    }

    /* ===== Game board ===== */
    /* The number of columns comes from JavaScript (--columns), so changing
       difficulty later is just a matter of changing one number. */
    #board {
      display: grid;
      grid-template-columns: repeat(var(--columns, 4), 1fr);
      gap: 10px;
      max-width: 560px;
      margin: 16px auto;
    }

    /* ===== Stats bar ===== */
    #stats {
      display: flex;
      flex-wrap: wrap;  /* lets the button drop to a new line on phones */
      justify-content: center;
      align-items: center;
      gap: 0.5rem 2rem;
      font-size: 1.4rem;
      font-weight: bold;
    }
    /* Tabular digits stop the timer from wiggling as the numbers change. */
    #stats span {
      font-variant-numeric: tabular-nums;
    }

    /* ===== Buttons (New Game, Play Again) ===== */
    .action-button {
      font: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.4em 1.2em;
      border: 3px solid var(--text);
      border-radius: 8px;
      background: var(--accent);
      color: #1b1b1b;  /* dark text stays readable on orange in both themes */
      cursor: pointer;
    }
    .action-button:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }

    /* ===== Win dialog ===== */
    #win-dialog {
      border: 4px solid var(--accent);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      max-width: min(90vw, 420px);
    }
    #win-dialog h2 {
      margin-top: 0;
      font-size: 2rem;
    }
    /* ::backdrop is the dimmed layer the browser draws behind a modal dialog. */
    #win-dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    /* ===== Cards =====
       Each card is a real <button>, so it's keyboard-friendly for free. */
    .card {
      position: relative;  /* anchors the ✓ badge on matched cards */
      aspect-ratio: 3 / 4;
      border: 3px solid transparent;
      border-radius: 10px;
      background: var(--card-back);
      color: white;
      font-size: clamp(1.8rem, 8vw, 3rem);
      cursor: pointer;
    }
    .card:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }
    .card.face-up {
      background: var(--card-face);
      border-color: var(--card-back);
    }
    /* Matched cards get a different color AND a ✓ mark,
       because color alone can't be the only signal. */
    .card.matched {
      background: var(--matched);
      border-color: transparent;
      cursor: default;
    }
    .card.matched::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 1.2rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <h1>Memory Match</h1>
    <p>
      Flip two cards at a time to find matching pairs.
      Clear the whole board in as few moves as you can!
    </p>

    <div id="stats">
      <span>Moves: <span id="moves">0</span></span>
      <span>Time: <span id="timer">0:00</span></span>
      <button id="new-game" class="action-button" type="button">New Game</button>
    </div>

    <!-- The cards are created by JavaScript, so a new game is a fresh shuffle. -->
    <section id="board" aria-label="Game board"></section>
  </main>

  <!-- <dialog> is built into HTML: showModal() dims the page, keeps keyboard
       focus inside the box, and lets Esc close it, with no extra code from us. -->
  <dialog id="win-dialog" aria-labelledby="win-title">
    <h2 id="win-title">🎉 You won!</h2>
    <p id="win-summary"></p>
    <button id="play-again" class="action-button" type="button">Play Again</button>
  </dialog>

  <script>
    // ===== Settings =====
    // 12 animals, enough for the largest grid we plan (6×4 = 12 pairs).
    const ANIMALS = ["🐶", "🐱", "🐭", "🐰", "🦊", "🐻",
                     "🐼", "🐨", "🐯", "🦁", "🐸", "🐵"];
    const PAIR_COUNT = 8;   // Medium: 4×4 grid
    const COLUMNS = 4;
    const MISMATCH_DELAY_MS = 1000;  // how long a wrong pair stays visible

    // ===== State =====
    let deck = [];             // the shuffled list of emoji, one entry per card
    let revealed = [];         // indexes of the (up to 2) cards currently turned up
    let matched = new Set();   // indexes of cards that have found their pair
    let isChecking = false;    // true during the 1-second pause, to block extra clicks
    let moves = 0;             // one move = one pair of cards flipped
    let secondsElapsed = 0;
    let timerId = null;        // null means the clock isn't running
    let flipBackId = null;     // the pending "flip the wrong pair back" timeout

    // ===== Game Logic =====

    // Fisher–Yates shuffle: every ordering is equally likely.
    // (The popular "sort with Math.random()" trick is biased, so we avoid it.)
    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    // Pick the animals for this game, put each one in twice, then shuffle.
    function buildDeck(pairCount) {
      const chosen = shuffle(ANIMALS).slice(0, pairCount);
      return shuffle([...chosen, ...chosen]);
    }

    // Reset all the state, deal a fresh deck, and redraw everything.
    function startNewGame() {
      stopTimer();
      // Cancel a flip-back still waiting from the old game. Otherwise it could
      // fire a moment later and flip cards in the NEW game.
      clearTimeout(flipBackId);

      deck = buildDeck(PAIR_COUNT);
      revealed = [];
      matched = new Set();
      isChecking = false;
      moves = 0;
      secondsElapsed = 0;

      renderBoard();
      updateStats();
    }

    // Called once two cards are face up.
    function checkForMatch() {
      const [first, second] = revealed;
      moves++;
      updateStats();

      if (deck[first] === deck[second]) {
        matched.add(first);
        matched.add(second);
        revealed = [];
        updateCard(first);
        updateCard(second);
        // Every card matched means the game is over.
        if (matched.size === deck.length) {
          stopTimer();
          showWinDialog();
        }
      } else {
        // Leave the wrong pair visible briefly so the player can memorize it.
        isChecking = true;
        flipBackId = setTimeout(() => {
          revealed = [];
          isChecking = false;
          updateCard(first);
          updateCard(second);
        }, MISMATCH_DELAY_MS);
      }
    }

    // ===== Timer =====

    // The clock starts on the first flip, not on page load,
    // so reading the instructions doesn't cost the player time.
    function startTimer() {
      if (timerId !== null) return;  // already running
      timerId = setInterval(() => {
        secondsElapsed++;
        updateStats();
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    // 75 seconds -> "1:15"
    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    // ===== Rendering =====
    const board = document.getElementById("board");
    const movesDisplay = document.getElementById("moves");
    const timerDisplay = document.getElementById("timer");

    const winDialog = document.getElementById("win-dialog");
    const winSummary = document.getElementById("win-summary");

    function updateStats() {
      movesDisplay.textContent = moves;
      timerDisplay.textContent = formatTime(secondsElapsed);
    }

    function showWinDialog() {
      winSummary.textContent =
        `You found all ${deck.length / 2} pairs in ${moves} moves ` +
        `and ${formatTime(secondsElapsed)}.`;
      winDialog.showModal();
    }

    // Make one card's appearance match the current state.
    // Every change goes through here, so the screen never disagrees with the data.
    function updateCard(index) {
      const card = board.children[index];
      const isMatched = matched.has(index);
      const isFaceUp = isMatched || revealed.includes(index);

      card.textContent = isFaceUp ? deck[index] : "?";
      card.classList.toggle("face-up", isFaceUp);
      card.classList.toggle("matched", isMatched);
      // aria-disabled (not disabled) keeps keyboard focus from jumping away.
      card.setAttribute("aria-disabled", isMatched);

      const status = isMatched ? "matched" : isFaceUp ? "face up" : "face down";
      // Only reveal the animal's name to screen readers when it's visible on screen.
      const label = isFaceUp ? `Card ${index + 1}, ${deck[index]}, ${status}`
                             : `Card ${index + 1}, ${status}`;
      card.setAttribute("aria-label", label);
    }

    function renderBoard() {
      board.style.setProperty("--columns", COLUMNS);
      board.replaceChildren();  // clear any cards from a previous game

      deck.forEach((animal, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.dataset.index = index;  // lets the click handler know which card it is
        board.appendChild(card);
        updateCard(index);
      });
    }

    // ===== Event Handlers =====

    // One listener on the board handles every card ("event delegation"),
    // so we don't have to attach 16 separate listeners.
    function handleCardClick(event) {
      const card = event.target.closest(".card");
      if (!card) return;  // clicked the gap between cards
      const index = Number(card.dataset.index);

      // Ignore clicks that shouldn't count.
      if (isChecking || matched.has(index) || revealed.includes(index)) return;

      startTimer();  // does nothing if the clock is already running
      revealed.push(index);
      updateCard(index);

      if (revealed.length === 2) {
        checkForMatch();
      }
    }

    function handlePlayAgain() {
      winDialog.close();
      startNewGame();
    }

    board.addEventListener("click", handleCardClick);
    document.getElementById("new-game").addEventListener("click", startNewGame);
    document.getElementById("play-again").addEventListener("click", handlePlayAgain);

    // ===== Initialization =====
    startNewGame();
  </script>
</body>
</html>
