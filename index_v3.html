<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match</title>
  <!--
    Version 3: a just-for-fun spinoff of version 2.
    It looks like the normal game, but now and then something is a little... off.
    Nothing here is scary, and it all ends in a surprise space party.
  -->
  <style>
    /* ===== Theme colors =====
       Kept as variables so a dark theme only has to swap the values. */
    :root {
      --bg: #f4f1ea;
      --text: #1b1b1b;
      --card-back: #2b4c7e;
      --card-face: #ffffff;
      --accent: #e07a1f;
      --focus: #ffbf00;
      --matched: #d8f0d2;
      --shadow-figure: rgba(0, 0, 0, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --text: #f2f2f2;
        --card-back: #3d6bb3;
        --card-face: #2a2d35;
        --accent: #ffa64d;
        --matched: #24452a;
        --shadow-figure: rgba(255, 255, 255, 0.12);  /* a black shadow wouldn't show */
      }
    }

    /* ===== Base layout =====
       The page is exactly one screen tall: title and controls on top, and the
       board gets whatever height is left, so the whole grid fits without scrolling. */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: 20px;  /* large default so it's readable from the back of the room */
      line-height: 1.4;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;  /* effects that drift past the edge never add a scrollbar */
    }
    main {
      position: relative;
      z-index: 1;  /* sits above the "passing shadow" effect */
      display: flex;
      flex-direction: column;
      height: 100vh;   /* fallback for older browsers */
      height: 100dvh;  /* "dynamic" height ignores phone browser toolbars */
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      line-height: 1.2;
      text-align: center;
    }
    .intro {
      margin: 0.2em 0 0.5em;
      text-align: center;
    }

    /* One focus style for every control, so keyboard users always see where they are. */
    button:focus-visible,
    select:focus-visible,
    .oddity:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }

    /* ===== Controls row ===== */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem 1rem;
      font-weight: bold;
    }
    select {
      font: inherit;
      padding: 0.2em 0.4em;
      border: 3px solid var(--card-back);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    .action-button,
    .sound-button {
      font: inherit;
      padding: 0.25em 1em;
      border: 3px solid var(--text);
      border-radius: 8px;
      cursor: pointer;
    }
    .action-button {
      background: var(--accent);
      color: #1b1b1b;  /* dark text stays readable on orange in both themes */
    }
    .sound-button {
      background: transparent;
      color: var(--text);
    }

    /* ===== Stats bar ===== */
    #stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 0.2rem 1.5rem;
      margin-top: 0.5rem;
      font-variant-numeric: tabular-nums;  /* digits don't wiggle as they change */
    }
    .stat {
      font-size: 1.1rem;
    }
    /* Moves are the goal of the game, so they're the biggest number on screen. */
    .stat-main {
      font-size: 1.7rem;
      font-weight: bold;
    }
    /* min-height reserves the line even when empty, so the board doesn't jump. */
    #message {
      min-height: 1.4em;
      margin: 0.2rem 0 0.4rem;
      text-align: center;
      font-weight: bold;
    }

    /* ===== Game board =====
       .board-area fills the leftover height. "container-type: size" lets the
       board measure that space with cqw/cqh units (like vw/vh, but for this box). */
    .board-area {
      flex: 1;
      min-height: 200px;  /* on very short screens, scroll rather than shrink to nothing */
      container-type: size;
    }
    #board {
      --gap: 10px;
      /* Each card is as wide as possible while ALL rows and columns still fit:
         the smaller of "width ÷ columns" and "height ÷ rows" (converted to a width
         using the card's 3:4 shape), capped so cards stay sensible on huge screens.
         --columns and --rows are set by JavaScript. */
      --card-width: min(
        (100cqw - (var(--columns) - 1) * var(--gap)) / var(--columns),
        (100cqh - (var(--rows) - 1) * var(--gap)) / var(--rows) * 3 / 4,
        180px
      );
      display: grid;
      grid-template-columns: repeat(var(--columns), var(--card-width));
      justify-content: center;
      gap: var(--gap);
    }

    /* ===== Cards =====
       Each card is a <button> holding a two-sided "inner" piece.
       Flipping = rotating the inner piece 180° around its vertical axis. */
    .card {
      aspect-ratio: 3 / 4;
      padding: 0;
      border: none;
      border-radius: 10px;
      background: none;
      color: inherit;
      cursor: pointer;
      perspective: 800px;          /* gives the flip its 3D depth */
      container-type: inline-size; /* lets text inside scale with the card (cqi units) */
    }
    .card-inner {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.35s ease;
    }
    .card.face-up .card-inner {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3cqi;
      border: 3px solid transparent;
      border-radius: 10px;
      /* Hide whichever side is turned away from the viewer. */
      -webkit-backface-visibility: hidden;  /* Safari still needs the prefix */
      backface-visibility: hidden;
    }
    .card-back {
      background: var(--card-back);
      color: white;
      font-size: 40cqi;
      font-weight: bold;
    }
    .card-front {
      transform: rotateY(180deg);  /* starts turned away; the flip brings it round */
      background: var(--card-face);
      border-color: var(--card-back);
    }
    .card-symbol {
      display: inline-block;  /* needed so the "look away" effect can mirror it */
      font-size: 50cqi;
      font-weight: bold;      /* only affects the Numbers theme */
      line-height: 1;
      transition: transform 0.6s ease;
    }
    .card-label {
      font-size: 15cqi;
      font-weight: bold;
    }
    /* Labels would be unreadably small on tiny cards (on a phone). */
    @container (max-width: 80px) {
      .card-label {
        display: none;
      }
    }
    /* Matched cards get a different color AND a ✓ mark,
       because color alone can't be the only signal. */
    .card.matched .card-front {
      background: var(--matched);
      border-color: transparent;
    }
    .card.matched .card-front::after {
      content: "✓";
      position: absolute;
      top: 3cqi;
      right: 6cqi;
      font-size: 16cqi;
    }
    .card.matched {
      cursor: default;
    }

    /* ===== Odd behaviors ("anomalies") =====
       Each effect is switched on by JavaScript for a moment, then switched off. */

    /* A card back opens an eye and blinks. */
    .eye {
      display: inline-block;
      font-size: 0.9em;
      animation: blink 1.8s ease-in-out;
    }
    @keyframes blink {
      0%, 70%, 100% { transform: scaleY(1); }
      78%           { transform: scaleY(0.1); }
      86%           { transform: scaleY(1); }
    }

    /* The title twitches while its text is wrong. */
    h1.glitch {
      animation: twitch 0.2s steps(2) infinite;
    }
    @keyframes twitch {
      from { transform: translateX(-1px) skewX(-4deg); }
      to   { transform: translateX(1px) skewX(3deg); }
    }

    /* The lights dim from the edges, then come back. A slow fade, never a flash. */
    #dimmer {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;  /* clicks pass straight through to the cards */
      background: radial-gradient(circle at center, transparent 25%, rgba(0, 0, 0, 0.75));
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    #dimmer.on {
      opacity: 1;
    }

    /* All the face-down cards breathe in and out together. */
    #board.breathing .card:not(.face-up) .card-inner {
      animation: breathe 2s ease-in-out 2;
    }
    @keyframes breathe {
      50% { transform: scale(1.05); }
    }

    /* A blurry shape drifts past behind the game. */
    .shadow-figure {
      position: fixed;
      top: 30%;
      left: -30vw;
      width: 22vw;
      height: 50vh;
      z-index: 0;  /* behind <main>, so it only shows around and between cards */
      pointer-events: none;
      border-radius: 50% 50% 40% 40%;
      background: radial-gradient(ellipse, var(--shadow-figure), transparent 70%);
      filter: blur(10px);
      animation: walk-past 7s linear forwards;
    }
    @keyframes walk-past {
      to { transform: translateX(160vw); }
    }

    /* A face-down card shakes, as if something knocked from inside. */
    .card.knocking {
      animation: knock 0.25s ease-in-out 4;
    }
    @keyframes knock {
      25% { transform: translateX(-3px) rotate(-1.5deg); }
      75% { transform: translateX(3px) rotate(1.5deg); }
    }

    /* The card backs slowly drift to a different color, then back. */
    .card-back {
      transition: filter 2s ease;
    }
    #board.color-drift .card-back {
      filter: hue-rotate(110deg);
    }

    /* The whole board slowly leans, like the room is tilting. */
    #board {
      transition: transform 2.5s ease-in-out;
    }
    #board.tilted {
      transform: rotate(1.5deg);
    }

    /* Little paw prints walk across the screen and fade away. */
    .paw-print {
      position: fixed;
      z-index: 2;
      pointer-events: none;
      font-size: 1.6rem;
      opacity: 0;
      transform: rotate(90deg);  /* toes pointing right, the way it's walking */
      animation: paw-fade 3s ease forwards;
      animation-delay: var(--delay);
    }
    @keyframes paw-fade {
      15%, 60% { opacity: 0.7; }
      100%     { opacity: 0; }
    }

    /* A matched picture slowly turns to face the other way, and stays that way. */
    .card-symbol.looking-away {
      transform: scaleX(-1);
    }

    /* ===== Win screen: surprise space party =====
       The dialog fills the whole screen with a starfield; floating emoji drift
       around a normal-looking results panel in the middle. */
    #win-dialog {
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: none;
      color: var(--text);
      overflow: hidden;
      /* Stars: two grids of tiny dots at different spacings, over a deep blue. */
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.9) 1px, transparent 1.5px) 0 0 / 110px 110px,
        radial-gradient(circle, rgba(255, 255, 255, 0.5) 1px, transparent 1.5px) 55px 70px / 170px 170px,
        radial-gradient(ellipse at bottom, #1f2b63, #05060f);
    }
    /* Only use flex while open; otherwise it would override the browser hiding it. */
    #win-dialog[open] {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #space-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    /* Each floater drifts and spins by its own random amount (set in JavaScript),
       then drifts back: "alternate" makes it bob like it's in zero gravity. */
    .floater {
      position: absolute;
      line-height: 1;
      animation: zero-g var(--duration) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }
    @keyframes zero-g {
      from { transform: translate(0, 0) rotate(0deg); }
      to   { transform: translate(var(--dx), var(--dy)) rotate(var(--spin)); }
    }
    .win-panel {
      position: relative;  /* above the floating emoji */
      width: min(92vw, 480px);
      max-height: 92dvh;
      overflow-y: auto;
      padding: 1.25rem clamp(0.75rem, 4vw, 1.5rem);
      border: 4px solid var(--accent);
      border-radius: 16px;
      background: var(--bg);
      text-align: center;
      animation: party-bob 3s ease-in-out infinite alternate;
    }
    @keyframes party-bob {
      from { transform: rotate(-1.5deg) translateY(-6px); }
      to   { transform: rotate(1.5deg) translateY(6px); }
    }
    .win-panel h2 {
      margin: 0;
      font-size: 2rem;
    }
    .win-twist {
      font-style: italic;
    }
    .stars {
      margin: 0.3rem 0;
    }
    #star-icons {
      font-size: 2.4rem;
      color: var(--accent);
      letter-spacing: 0.1em;
    }
    /* If the table is still too wide for a tiny screen, it scrolls on its own
       instead of being cut off. */
    .score-scroll {
      overflow-x: auto;
    }
    #score-table {
      width: 100%;
      margin: 0.5rem 0;
      border-collapse: collapse;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }
    #score-table caption {
      font-weight: bold;
      margin-bottom: 0.3rem;
    }
    #score-table th,
    #score-table td {
      padding: 0.25em 0.2em;
      border-bottom: 1px solid var(--card-back);
    }
    /* The score you just set is bold, highlighted, AND labeled "new". */
    #score-table tr.new-score {
      background: var(--matched);
      font-weight: bold;
    }
    #score-note {
      font-size: 1rem;
    }

    /* ===== Oddities collection (on the win screen) ===== */
    .collection {
      margin: 0.8rem 0;
      padding-top: 0.6rem;
      border-top: 2px dashed var(--card-back);
    }
    .collection h3 {
      margin: 0 0 0.5rem;
      font-size: 1.15rem;
    }
    .oddity-grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0.4rem;
    }
    /* On phones, 4 per row keeps each tile big enough to tap. */
    @media (max-width: 480px) {
      .oddity-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .oddity {
      position: relative;  /* anchors the "new" badge */
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--card-back);
      border-radius: 8px;
      background: var(--card-face);
      font-size: 1.5rem;
      cursor: help;
    }
    /* Not spotted yet: looks like a face-down card. */
    .oddity.locked {
      background: var(--card-back);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: default;
    }
    /* The tile whose note is showing gets a thicker orange border. */
    .oddity.selected {
      border: 3px solid var(--accent);
    }
    /* Spotted for the first time in this game. The word "new" is the signal,
       not just the color. */
    .oddity.is-new::after {
      content: "new";
      position: absolute;
      top: -0.6em;
      right: -0.4em;
      padding: 0 0.3em;
      border-radius: 4px;
      background: var(--accent);
      color: #1b1b1b;
      font-size: 0.6rem;
      font-weight: bold;
    }
    /* min-height keeps the panel from jumping as notes of different lengths appear. */
    .oddity-note {
      min-height: 3em;
      margin: 0.5rem 0 0;
      font-size: 1rem;
    }

    /* ===== Reduced motion =====
       Respect the "reduce motion" system setting: no flipping, twitching,
       breathing, drifting, or bobbing. The odd behaviors that don't move
       (wrong text, dimming, paw prints fading in) still happen. */
    @media (prefers-reduced-motion: reduce) {
      .card-inner,
      .card-symbol,
      .card-back,
      #dimmer {
        transition: none;
      }
      #board.tilted {
        transform: none;
      }
      .eye,
      .card.knocking,
      h1.glitch,
      #board.breathing .card:not(.face-up) .card-inner,
      .floater,
      .win-panel {
        animation: none;
      }
      .shadow-figure {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title">Memory Match</h1>
      <p class="intro">
        Flip two cards at a time to find matching pairs. Fewer moves earn more stars!
      </p>
    </header>

    <div class="controls">
      <span>Difficulty: Hard</span>

      <label>
        Theme:
        <!-- The values must match the keys in THEMES in the script. -->
        <select id="theme">
          <option value="animals">Animals</option>
          <option value="fruit">Fruit</option>
          <option value="numbers">Numbers</option>
        </select>
      </label>

      <button id="new-game" class="action-button" type="button">New Game</button>
      <button id="sound-toggle" class="sound-button" type="button"></button>
    </div>

    <div id="stats">
      <span class="stat stat-main">Moves: <span id="moves">0</span></span>
      <span class="stat">Points: <span id="points">0</span></span>
      <span class="stat">Time: <span id="timer">0:00</span></span>
    </div>
    <!-- aria-live makes screen readers announce each new message ("Match!") -->
    <p id="message" aria-live="polite"></p>

    <div class="board-area">
      <!-- The cards are created by JavaScript, so a new game is a fresh shuffle. -->
      <section id="board" aria-label="Game board"></section>
    </div>
  </main>

  <!-- The "lights dimming" effect. Always in the page, invisible until switched on. -->
  <div id="dimmer" aria-hidden="true"></div>

  <!-- <dialog> is built into HTML: showModal() keeps keyboard focus inside
       and lets Esc close it, with no extra code from us. -->
  <dialog id="win-dialog" aria-labelledby="win-title">
    <!-- Decoration only, so screen readers skip it. -->
    <div id="space-layer" aria-hidden="true"></div>

    <div class="win-panel">
      <h2 id="win-title">🥳 Surprise!</h2>
      <p class="win-twist">
        Sorry about all the weirdness. The cards were just setting up your party.
      </p>
      <p class="stars">
        <!-- The star symbols are decoration; the text next to them says the same thing. -->
        <span id="star-icons" aria-hidden="true"></span>
        <span id="star-text"></span>
      </p>
      <p id="win-summary"></p>

      <div class="score-scroll">
      <table id="score-table">
        <caption id="score-caption"></caption>
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Moves</th>
            <th scope="col">Time</th>
            <th scope="col">Points</th>
            <th scope="col">Theme</th>
          </tr>
        </thead>
        <tbody id="score-rows"></tbody>
      </table>
      </div>
      <p id="score-note"></p>

      <section class="collection" aria-labelledby="collection-title">
        <h3 id="collection-title">
          Oddities spotted: <span id="spotted-count">0</span> of <span id="oddity-total"></span>
        </h3>
        <!-- One tile per oddity, built by JavaScript. -->
        <ul id="oddity-grid" class="oddity-grid"></ul>
        <p id="oddity-note" class="oddity-note"></p>
      </section>

      <!-- autofocus: the dialog starts on this button, not on the first tile. -->
      <button id="play-again" class="action-button" type="button" autofocus>Play Again</button>
    </div>
  </dialog>

  <script>
    // ===== Settings =====

    // Each theme has 12 cards, exactly enough for the 6×4 Hard grid.
    // Every card has a name, used for the label and for screen readers.
    const THEMES = {
      animals: {
        label: "Animals",
        showLabels: true,
        cards: [
          { symbol: "🐘", name: "Elephant" },  { symbol: "🦒", name: "Giraffe" },
          { symbol: "🐢", name: "Turtle" },    { symbol: "🐙", name: "Octopus" },
          { symbol: "🦋", name: "Butterfly" }, { symbol: "🐝", name: "Bee" },
          { symbol: "🦀", name: "Crab" },      { symbol: "🐌", name: "Snail" },
          { symbol: "🦉", name: "Owl" },       { symbol: "🐧", name: "Penguin" },
          { symbol: "🐳", name: "Whale" },     { symbol: "🦩", name: "Flamingo" },
        ],
      },
      fruit: {
        label: "Fruit",
        showLabels: true,
        cards: [
          { symbol: "🍎", name: "Apple" },     { symbol: "🍌", name: "Banana" },
          { symbol: "🍇", name: "Grapes" },    { symbol: "🍉", name: "Watermelon" },
          { symbol: "🍓", name: "Strawberry" },{ symbol: "🍍", name: "Pineapple" },
          { symbol: "🥝", name: "Kiwi" },      { symbol: "🍒", name: "Cherries" },
          { symbol: "🥥", name: "Coconut" },   { symbol: "🍋", name: "Lemon" },
          { symbol: "🥑", name: "Avocado" },   { symbol: "🍑", name: "Peach" },
        ],
      },
      // A label like "Seven" under a 7 would add nothing, so labels are off here.
      numbers: {
        label: "Numbers",
        showLabels: false,
        cards: ["One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight",
                "Nine", "Ten", "Eleven", "Twelve"]
          .map((name, i) => ({ symbol: String(i + 1), name })),
      },
    };

    // Version 3 is always played on Hard: 12 pairs in a 6×4 grid.
    const LEVEL = { label: "Hard", pairs: 12, columns: 6 };

    const MISMATCH_DELAY_MS = 700;    // how long a wrong pair stays up (clicking skips it)
    const WIN_DIALOG_DELAY_MS = 500;  // lets the last card finish flipping first
    const POINTS_PER_MATCH = 10;      // multiplied by the streak: 10, 20, 30, ...

    // Stars are based on moves per pair. Even with perfect memory you need about
    // 1.6 moves per pair on average, because the first flips are blind guesses.
    const THREE_STAR_MOVES_PER_PAIR = 1.75;
    const TWO_STAR_MOVES_PER_PAIR = 2.5;

    const MAX_SAVED_SCORES = 5;
    // Its own key, so version 3's scores don't mix with version 2's.
    const SCORES_KEY = "memoryMatch.v3.bestScores";
    const MUTE_KEY = "memoryMatch.muted";
    // Safety ceiling for loudness. Before a note plays, the game adds up the
    // volume of every note that would overlap it; if the total would go over
    // this, the new note is skipped. Normal play stays well under it, so it
    // only matters if many sounds ever pile up at once.
    const MAX_TOTAL_VOLUME = 0.6;

    // Odd behaviors come in two phases:
    //  1. Opening: 4 or 5 of them, at random moves from 2 to 12. A Hard game
    //     always takes at least 12 moves, so every one of these gets its turn.
    //  2. After move 12: one more every 3 to 4 moves, until the game ends.
    const MIN_ANOMALIES = 4;
    const MAX_ANOMALIES = 5;
    const FIRST_ANOMALY_MOVE = 2;
    const LAST_ANOMALY_MOVE = 12;
    const LATE_GAP_MIN = 3;
    const LATE_GAP_MAX = 4;

    // Text for some of the anomalies.
    const TITLE_TEXT = "Memory Match";
    const GLITCHED_TITLES = ["Memory Watch", "Memory Match?", "Memory Matches You", "Mem0ry Match"];
    const WHISPERS = [
      "Did that card just move?",
      "Someone else is playing too.",
      "It remembers where you looked.",
      "Shh… the cards are sleeping.",
      "That one blinked. Probably.",
      "You've played this before, haven't you?",
    ];
    const WRONG_MOVE_COUNTS = ["13", "??", "∞", "-1"];

    // Extra party guests for the win screen, added to the theme's own pictures.
    const PARTY_EXTRAS = ["🚀", "🪐", "⭐", "🛸", "🧑‍🚀", "🎈", "🎉", "🌙"];
    const FLOATER_COUNT = 32;

    // Each sound is a list of notes: [frequency in Hz, start in s, length in s, volume].
    // Making the sounds in code means the game needs no audio files.
    const SOUNDS = {
      flip:  [[600, 0, 0.05]],
      match: [[660, 0, 0.1], [880, 0.1, 0.15]],
      miss:  [[220, 0, 0.2]],
      // Two notes almost (but not quite) the same pitch make an uneasy "wobble".
      eerie: [[196, 0, 1.2, 0.07], [201, 0, 1.2, 0.07]],
      knock: [[110, 0, 0.08, 0.3], [110, 0.2, 0.08, 0.3]],
      party: [[523, 0, 0.12], [659, 0.12, 0.12], [784, 0.24, 0.12], [1047, 0.36, 0.4],
              [784, 0.8, 0.1], [1047, 0.9, 0.5]],
    };

    // ===== State =====
    let currentTheme = "animals";
    let deck = [];             // the shuffled list of cards: { symbol, name }
    let revealed = [];         // indexes of the (up to 2) cards currently turned up
    let matched = new Set();   // indexes of cards that have found their pair
    let isChecking = false;    // true while a wrong pair is waiting to flip back
    let moves = 0;             // one move = one pair of cards flipped
    let points = 0;
    let streak = 0;            // matches in a row; a wrong pair resets it to 0
    let secondsElapsed = 0;    // the REAL time, used for scores
    let displayedSeconds = 0;  // the time on screen (the "time slip" anomaly fiddles with it)
    let backwardTicks = 0;     // while above 0, the clock on screen runs backwards
    let timerId = null;        // null means the clock isn't running
    let flipBackId = null;     // the pending "flip the wrong pair back" timeout
    let winDialogId = null;    // the pending "show the win dialog" timeout
    let plannedAnomalies = []; // this game's opening anomalies: { anomaly, atMove }
    let usedAnomalies = new Set(); // names already shown this game (avoids repeats)
    let nextLateMove = 0;      // the move for the next anomaly after move 12
    // For the win-screen collection. Kept only while the page is open (not saved),
    // so closing or reloading the page starts a fresh collection.
    let spottedThisSession = new Set();     // names of every anomaly actually seen
    let spottedBeforeThisGame = new Set();  // snapshot at game start, to mark what's "new"
    let anomalyTimers = [];    // pending anomaly timeouts, cancelled on a new game
    let audioContext = null;   // created on the first sound (see playSound)
    let scheduledNotes = [];   // notes playing or about to play: { start, end, volume }
    let isMuted = loadMuted();

    // ===== Saved Data (localStorage) =====
    // Only non-personal data is saved: scores with no names, and the mute setting.
    // Every access is wrapped in try/catch because storage can be switched off
    // (e.g. private browsing). The game must still work without it.

    function loadBestScores() {
      try {
        const data = JSON.parse(localStorage.getItem(SCORES_KEY));
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveBestScores(scores) {
      try {
        localStorage.setItem(SCORES_KEY, JSON.stringify(scores));
        return true;
      } catch {
        return false;
      }
    }

    // Add a finished game to the top list. Returns the list, where the new score
    // landed (-1 = didn't make it), and whether saving worked.
    function addBestScore(entry) {
      const list = [...loadBestScores(), entry]
        // Fewest moves ranks first; time only breaks ties (moves are the goal).
        .sort((a, b) => a.moves - b.moves || a.seconds - b.seconds)
        .slice(0, MAX_SAVED_SCORES);
      const saved = saveBestScores(list);
      return { list, rank: list.indexOf(entry), saved };
    }

    function loadMuted() {
      try {
        return localStorage.getItem(MUTE_KEY) === "true";
      } catch {
        return false;
      }
    }

    function saveMuted() {
      try {
        localStorage.setItem(MUTE_KEY, String(isMuted));
      } catch {
        // Not saved; the setting still works until the page is closed.
      }
    }

    // ===== Helpers =====

    // Fisher–Yates shuffle: every ordering is equally likely.
    // (The popular "sort with Math.random()" trick is biased, so we avoid it.)
    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    // A random whole number from min to max, including both.
    function randomInt(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    // ===== Game Logic =====

    // Pick cards from the theme, put each one in twice, then shuffle.
    function buildDeck(themeKey, pairCount) {
      const chosen = shuffle(THEMES[themeKey].cards).slice(0, pairCount);
      return shuffle([...chosen, ...chosen]);
    }

    // Reset all the state, deal a fresh deck, and redraw everything.
    function startNewGame() {
      stopTimer();
      // Cancel anything still waiting from the old game. Otherwise it could
      // fire a moment later and act on the NEW game.
      clearTimeout(flipBackId);
      clearTimeout(winDialogId);
      resetAnomalyEffects();

      deck = buildDeck(currentTheme, LEVEL.pairs);
      revealed = [];
      matched = new Set();
      isChecking = false;
      moves = 0;
      points = 0;
      streak = 0;
      secondsElapsed = 0;
      displayedSeconds = 0;
      spottedBeforeThisGame = new Set(spottedThisSession);
      planAnomalies();

      renderBoard();
      updateStats();
      showMessage("Flip any card to start.");
    }

    // Called once two cards are face up.
    function checkForMatch() {
      const [first, second] = revealed;
      moves++;

      // Compare names, not pictures: the name is the card's identity.
      if (deck[first].name === deck[second].name) {
        matched.add(first);
        matched.add(second);
        revealed = [];
        streak++;
        const earned = POINTS_PER_MATCH * streak;
        points += earned;
        updateCard(first);
        updateCard(second);
        showMessage(streak > 1
          ? `Match! +${earned} points (${streak} in a row 🔥)`
          : `Match! +${earned} points`);

        if (matched.size === deck.length) {
          updateStats();
          finishGame();
          return;  // no more anomalies once the game is won
        }
        playSound("match");
      } else {
        streak = 0;
        isChecking = true;
        showMessage("Not a match.");
        playSound("miss");
        // Leave the wrong pair up briefly so the player can memorize it.
        flipBackId = setTimeout(flipBackNow, MISMATCH_DELAY_MS);
      }
      updateStats();
      triggerAnomaliesForThisMove();
    }

    // Turn a wrong pair face down: either when the delay ends, or straight
    // away if the player clicks another card first.
    function flipBackNow() {
      clearTimeout(flipBackId);
      const [first, second] = revealed;
      revealed = [];
      isChecking = false;
      updateCard(first);
      updateCard(second);
      showMessage("");
    }

    function finishGame() {
      stopTimer();
      resetAnomalyEffects();  // the weirdness stops: it's party time
      playSound("party");
      const entry = { moves, seconds: secondsElapsed, points, theme: currentTheme };
      const result = addBestScore(entry);
      showMessage(`All ${deck.length / 2} pairs found!`);
      winDialogId = setTimeout(() => showWinDialog(entry, result), WIN_DIALOG_DELAY_MS);
    }

    // 1 to 3 stars, based on how many moves each pair took on average.
    function starsFor(moveCount, pairCount) {
      const movesPerPair = moveCount / pairCount;
      if (movesPerPair <= THREE_STAR_MOVES_PER_PAIR) return 3;
      if (movesPerPair <= TWO_STAR_MOVES_PER_PAIR) return 2;
      return 1;
    }

    // ===== Timer =====

    // The clock starts on the first flip, not on page load,
    // so reading the instructions doesn't cost the player time.
    function startTimer() {
      if (timerId !== null) return;  // already running
      timerId = setInterval(tick, 1000);
    }

    function tick() {
      secondsElapsed++;
      // Normally the screen shows the real time. During a "time slip" it
      // counts backwards instead, then jumps back to the real time.
      if (backwardTicks > 0) {
        backwardTicks--;
        displayedSeconds = Math.max(0, displayedSeconds - 1);
      } else {
        displayedSeconds = secondsElapsed;
      }
      updateTimerDisplay();
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    // 75 seconds -> "1:15"
    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    // ===== Anomalies =====
    // Sixteen small, harmless oddities, picked at random so no two games feel
    // the same. Every one either undoes itself after a few seconds or is purely
    // cosmetic: none of them change the cards' positions, the score, or the
    // real time.

    // Each anomaly also has an icon and a fun note for the collection on the
    // win screen. The notes "explain" each oddity as party preparations.
    const ANOMALIES = [
      { name: "Watching eye", icon: "👁️", run: watchingEye,
        note: "It wasn't watching you. It was watching the door for the guest of honor." },
      { name: "Title glitch", icon: "📛", run: titleGlitch,
        note: "The title tried on a few party name tags before picking one." },
      { name: "Lights dim", icon: "💡", run: lightsDim,
        note: "Someone was testing the mood lighting. Probably the octopus." },
      { name: "Whisper", icon: "💬", run: whisper,
        note: "Shh! The cards were whispering so you wouldn't hear about the party." },
      { name: "Move hiccup", icon: "🔢", run: moveHiccup,
        note: "The move counter sneezed from all the confetti dust. Bless you, counter." },
      { name: "Time slip", icon: "⏪", run: timeSlip,
        note: "The cards needed four more seconds to blow up the balloons." },
      { name: "Breathing cards", icon: "🫁", run: breathingCards,
        note: "The cards were practicing their big 'SURPRISE!' breath." },
      { name: "Passing shadow", icon: "👤", run: passingShadow,
        note: "Just the party planner sneaking past with an armful of streamers." },
      { name: "Look away", icon: "🙈", run: lookAway,
        note: "That card was trying very hard not to give away the surprise." },
      { name: "Paw prints", icon: "🐾", run: pawPrints,
        note: "A very small guest arrived early and didn't wipe its feet." },
      { name: "Question flip", icon: "¿", run: questionFlip,
        note: "The question marks were doing handstands to pass the time." },
      { name: "Knocking", icon: "🚪", run: knocking,
        note: "Someone was hanging decorations inside a card. Sorry about the noise!" },
      { name: "Color drift", icon: "🎨", run: colorDrift,
        note: "The cards were trying on outfits for the party." },
      { name: "Listening", icon: "👂", run: listening,
        note: "The sound button was listening for the cue to start the party music." },
      { name: "Wrong picture", icon: "🔀", run: wrongPicture,
        note: "Two cards swapped costumes for a second. They were rehearsing." },
      { name: "Tilted room", icon: "📐", run: tiltedRoom,
        note: "The whole board leaned over to peek at the snack table." },
    ];

    // Choose the opening anomalies and the move at which each happens.
    function planAnomalies() {
      const count = randomInt(MIN_ANOMALIES, MAX_ANOMALIES);
      const chosen = shuffle(ANOMALIES).slice(0, count);

      const possibleMoves = [];
      for (let move = FIRST_ANOMALY_MOVE; move <= LAST_ANOMALY_MOVE; move++) {
        possibleMoves.push(move);
      }
      const triggerMoves = shuffle(possibleMoves).slice(0, count).sort((a, b) => a - b);

      plannedAnomalies = chosen.map((anomaly, i) => ({ anomaly, atMove: triggerMoves[i] }));
      usedAnomalies = new Set(chosen.map((anomaly) => anomaly.name));
      nextLateMove = LAST_ANOMALY_MOVE + randomInt(LATE_GAP_MIN, LATE_GAP_MAX);
    }

    // For the late phase: an anomaly not seen yet this game. Once all 16 have
    // appeared, start over, so repeats only happen in very long games.
    function pickFreshAnomaly() {
      let candidates = ANOMALIES.filter((anomaly) => !usedAnomalies.has(anomaly.name));
      if (candidates.length === 0) {
        usedAnomalies = new Set();
        candidates = ANOMALIES;
      }
      const anomaly = randomItem(candidates);
      usedAnomalies.add(anomaly.name);
      return anomaly;
    }

    // After each move, run whatever is due, after a short random pause, so
    // it doesn't feel directly tied to the click.
    function triggerAnomaliesForThisMove() {
      // Phase 1: the opening plan.
      for (const plan of plannedAnomalies) {
        if (plan.atMove === moves) {
          later(() => runAnomaly(plan.anomaly), randomInt(400, 1500));
        }
      }
      // Phase 2: after move 12, one every 3 to 4 moves.
      if (moves === nextLateMove) {
        const anomaly = pickFreshAnomaly();
        later(() => runAnomaly(anomaly), randomInt(400, 1500));
        nextLateMove = moves + randomInt(LATE_GAP_MIN, LATE_GAP_MAX);
      }
    }

    // Run an anomaly and add it to the collection. An anomaly returns false
    // when it couldn't happen (e.g. no matched card to look away yet), so the
    // collection only counts what the player could actually have seen.
    function runAnomaly(anomaly) {
      if (anomaly.run() === false) return;
      spottedThisSession.add(anomaly.name);
    }

    function anomalyNamed(name) {
      return ANOMALIES.find((anomaly) => anomaly.name === name);
    }

    // setTimeout that remembers its id, so a new game can cancel it.
    function later(callback, delayMs) {
      anomalyTimers.push(setTimeout(callback, delayMs));
    }

    // Undo every effect that might be in progress. Used for a new game and for the win.
    function resetAnomalyEffects() {
      anomalyTimers.forEach(clearTimeout);
      anomalyTimers = [];
      titleHeading.textContent = TITLE_TEXT;
      titleHeading.classList.remove("glitch");
      dimmer.classList.remove("on");
      board.classList.remove("breathing", "color-drift", "tilted");
      updateSoundButton();
      backwardTicks = 0;
      displayedSeconds = secondsElapsed;
      // Put every card's back and picture right again (eyes, "¿", wrong pictures).
      [...board.children].forEach((card, index) => {
        card.classList.remove("knocking");
        card.querySelector(".card-back").textContent = "?";
        card.querySelector(".card-symbol").textContent = deck[index].symbol;
      });
      // Temporary effect elements (shadow, paw prints) are tagged so they're easy to find.
      document.querySelectorAll(".anomaly-temp").forEach((element) => element.remove());
    }

    // Cards the player can't currently see the front of.
    function faceDownCards() {
      return deck
        .map((_, index) => index)
        .filter((index) => !matched.has(index) && !revealed.includes(index))
        .map((index) => board.children[index]);
    }

    // 1. One card's "?" becomes an eye, blinks, and goes back to normal.
    function watchingEye() {
      const card = randomItem(faceDownCards());
      if (!card) return false;  // no face-down card to use
      const back = card.querySelector(".card-back");
      back.replaceChildren(makeSpan("eye", "👁️"));
      later(() => { back.textContent = "?"; }, 1800);
    }

    // 2. The title briefly says something slightly wrong.
    function titleGlitch() {
      titleHeading.textContent = randomItem(GLITCHED_TITLES);
      titleHeading.classList.add("glitch");
      later(() => {
        titleHeading.textContent = TITLE_TEXT;
        titleHeading.classList.remove("glitch");
      }, 1500);
    }

    // 3. The lights slowly dim from the edges, then come back up.
    function lightsDim() {
      dimmer.classList.add("on");
      playSound("eerie");
      later(() => dimmer.classList.remove("on"), 2600);
    }

    // 4. The message line says something odd, then clears.
    function whisper() {
      const text = randomItem(WHISPERS);
      showMessage(text);
      playSound("eerie");
      // Only clear it if nothing else has replaced it in the meantime.
      later(() => {
        if (messageDisplay.textContent === text) showMessage("");
      }, 3500);
    }

    // 5. The move counter shows a wrong number for a moment.
    // (Only the display changes; the real count is safe in `moves`.)
    function moveHiccup() {
      movesDisplay.textContent = randomItem(WRONG_MOVE_COUNTS);
      later(updateStats, 1200);
    }

    // 6. The clock on screen runs backwards for a few seconds.
    function timeSlip() {
      backwardTicks = 4;
    }

    // 7. All the face-down cards breathe in and out together.
    function breathingCards() {
      board.classList.add("breathing");
      later(() => board.classList.remove("breathing"), 4000);
    }

    // 8. A blurry shape drifts past behind the game.
    function passingShadow() {
      const shadow = document.createElement("div");
      shadow.className = "shadow-figure anomaly-temp";
      shadow.setAttribute("aria-hidden", "true");
      document.body.appendChild(shadow);
      later(() => shadow.remove(), 7500);
    }

    // 9. A matched picture slowly turns to face the other way, for the rest of the game.
    // If nothing is matched yet, an eye opens instead.
    function lookAway() {
      const matchedIndexes = [...matched];
      if (matchedIndexes.length === 0) {
        runAnomaly(anomalyNamed("Watching eye"));
        return false;  // the eye happened instead, and is counted on its own
      }
      const card = board.children[randomItem(matchedIndexes)];
      card.querySelector(".card-symbol").classList.add("looking-away");
    }

    // 10. A trail of paw prints walks across the screen and fades.
    function pawPrints() {
      const startX = randomInt(5, 55);   // percent of the screen width
      const startY = randomInt(30, 75);  // percent of the screen height
      for (let step = 0; step < 6; step++) {
        const print = makeSpan("paw-print anomaly-temp", "🐾");
        print.setAttribute("aria-hidden", "true");
        print.style.left = `${startX + step * 6}vw`;
        // Alternate up and down a little, like left and right feet.
        print.style.top = `${startY + (step % 2 === 0 ? -2 : 2)}vh`;
        print.style.setProperty("--delay", `${step * 0.35}s`);
        document.body.appendChild(print);
      }
      later(() => {
        document.querySelectorAll(".paw-print").forEach((print) => print.remove());
      }, 6000);
    }

    // 11. A few "?" turn upside down, then flip back.
    function questionFlip() {
      const backs = shuffle(faceDownCards()).slice(0, 3).map((card) => card.querySelector(".card-back"));
      if (backs.length === 0) return false;
      backs.forEach((back) => { back.textContent = "¿"; });
      later(() => backs.forEach((back) => { back.textContent = "?"; }), 2500);
    }

    // 12. A face-down card shakes, as if knocked from inside.
    function knocking() {
      const card = randomItem(faceDownCards());
      if (!card) return false;  // no face-down card to use
      card.classList.add("knocking");
      playSound("knock");
      later(() => card.classList.remove("knocking"), 1100);
    }

    // 13. The card backs slowly drift to a different color, then back.
    function colorDrift() {
      board.classList.add("color-drift");
      later(() => board.classList.remove("color-drift"), 4500);
    }

    // 14. The sound button briefly says it's listening.
    function listening() {
      soundButton.textContent = "👂 Listening…";
      later(updateSoundButton, 2500);
    }

    // 15. A matched card shows the wrong picture for a moment.
    // If nothing is matched yet, some "?" flip upside down instead.
    function wrongPicture() {
      const matchedIndexes = [...matched];
      if (matchedIndexes.length === 0) {
        runAnomaly(anomalyNamed("Question flip"));
        return false;  // the question flip happened instead, and is counted on its own
      }
      const index = randomItem(matchedIndexes);
      const symbol = board.children[index].querySelector(".card-symbol");
      const others = THEMES[currentTheme].cards.filter((card) => card.name !== deck[index].name);
      symbol.textContent = randomItem(others).symbol;
      later(() => { symbol.textContent = deck[index].symbol; }, 1500);
    }

    // 16. The whole board slowly leans, then straightens up.
    function tiltedRoom() {
      board.classList.add("tilted");
      later(() => board.classList.remove("tilted"), 3500);
    }

    // ===== Sound =====

    function playSound(name) {
      if (isMuted) return;
      try {
        // Browsers only allow sound after the user has clicked something, so the
        // audio system is created on first use, which is always after a click.
        audioContext ??= new AudioContext();
        for (const [frequency, start, length, volume = 0.2] of SOUNDS[name]) {
          playNote(frequency, start, length, volume);
        }
      } catch {
        // No Web Audio in this browser: the game simply stays silent.
      }
    }

    // One beep: a sine-wave tone that fades out.
    function playNote(frequency, start, length, volume) {
      const startTime = audioContext.currentTime + start;
      const endTime = startTime + length;

      // Safety ceiling: forget notes that have finished, then add up the ones
      // that would overlap this one. Skip this note if it would be too loud.
      scheduledNotes = scheduledNotes.filter((note) => note.end > audioContext.currentTime);
      const overlappingVolume = scheduledNotes
        .filter((note) => note.start < endTime && note.end > startTime)
        .reduce((total, note) => total + note.volume, 0);
      if (overlappingVolume + volume > MAX_TOTAL_VOLUME) return;
      scheduledNotes.push({ start: startTime, end: endTime, volume });

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.frequency.value = frequency;
      // Fading out (instead of stopping dead) avoids an ugly click at the end.
      gain.gain.setValueAtTime(volume, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, endTime);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(startTime);
      oscillator.stop(endTime);
    }

    // ===== Rendering =====
    const titleHeading = document.getElementById("title");
    const board = document.getElementById("board");
    const movesDisplay = document.getElementById("moves");
    const pointsDisplay = document.getElementById("points");
    const timerDisplay = document.getElementById("timer");
    const messageDisplay = document.getElementById("message");
    const themeSelect = document.getElementById("theme");
    const soundButton = document.getElementById("sound-toggle");
    const dimmer = document.getElementById("dimmer");
    const winDialog = document.getElementById("win-dialog");
    const spaceLayer = document.getElementById("space-layer");
    const oddityGrid = document.getElementById("oddity-grid");
    const oddityNote = document.getElementById("oddity-note");

    function makeSpan(className, text) {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;
      return span;
    }

    // Build one two-sided card. The front is always in the page (the flip
    // animation needs both sides), but it's turned away until flipped, and the
    // button's aria-label keeps screen readers from announcing it early.
    function createCard(cardData, index, showLabels) {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.dataset.index = index;  // lets the click handler know which card it is

      const front = makeSpan("card-face card-front", "");
      front.appendChild(makeSpan("card-symbol", cardData.symbol));
      if (showLabels) {
        front.appendChild(makeSpan("card-label", cardData.name));
      }

      const inner = makeSpan("card-inner", "");
      inner.append(makeSpan("card-face card-back", "?"), front);
      card.appendChild(inner);
      return card;
    }

    // Make one card's appearance match the current state.
    // Every change goes through here, so the screen never disagrees with the data.
    function updateCard(index) {
      const card = board.children[index];
      const isMatched = matched.has(index);
      const isFaceUp = isMatched || revealed.includes(index);

      card.classList.toggle("face-up", isFaceUp);
      card.classList.toggle("matched", isMatched);
      // aria-disabled (not disabled) keeps keyboard focus from jumping away.
      card.setAttribute("aria-disabled", isMatched);

      const status = isMatched ? "matched" : isFaceUp ? "face up" : "face down";
      // Only reveal the card's name to screen readers when it's visible on screen.
      const label = isFaceUp ? `Card ${index + 1}, ${deck[index].name}, ${status}`
                             : `Card ${index + 1}, ${status}`;
      card.setAttribute("aria-label", label);
    }

    function renderBoard() {
      // The CSS uses these two numbers to size the cards so the whole grid fits.
      board.style.setProperty("--columns", LEVEL.columns);
      board.style.setProperty("--rows", (LEVEL.pairs * 2) / LEVEL.columns);
      board.replaceChildren();  // clear any cards from a previous game

      const showLabels = THEMES[currentTheme].showLabels;
      deck.forEach((cardData, index) => {
        board.appendChild(createCard(cardData, index, showLabels));
        updateCard(index);
      });
    }

    function updateStats() {
      movesDisplay.textContent = moves;
      pointsDisplay.textContent = points;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      timerDisplay.textContent = formatTime(displayedSeconds);
    }

    function showMessage(text) {
      messageDisplay.textContent = text;
    }

    // The button's text says the current state, so it reads clearly aloud too.
    function updateSoundButton() {
      soundButton.textContent = isMuted ? "🔇 Sound off" : "🔊 Sound on";
    }

    // Fill the starfield with floating party guests: the theme's own pictures
    // plus some space-party extras. Each one gets a random place, size, drift,
    // spin, and speed, which the CSS "zero-g" animation uses.
    function fillSpaceParty() {
      const guests = [...THEMES[currentTheme].cards.map((card) => card.symbol), ...PARTY_EXTRAS];
      const floaters = [];
      for (let i = 0; i < FLOATER_COUNT; i++) {
        const floater = makeSpan("floater", randomItem(guests));
        floater.style.left = `${randomInt(0, 95)}%`;
        floater.style.top = `${randomInt(0, 92)}%`;
        floater.style.fontSize = `${randomInt(15, 45) / 10}rem`;
        floater.style.setProperty("--dx", `${randomInt(-12, 12)}vw`);
        floater.style.setProperty("--dy", `${randomInt(-12, 12)}vh`);
        floater.style.setProperty("--spin", `${randomInt(-200, 200)}deg`);
        floater.style.setProperty("--duration", `${randomInt(5, 12)}s`);
        // A negative delay starts each one partway through its drift,
        // so they don't all move in step.
        floater.style.setProperty("--delay", `-${randomInt(0, 10)}s`);
        floaters.push(floater);
      }
      spaceLayer.replaceChildren(...floaters);
    }

    const COLLECTION_HINT = "Hover over (or tap) a spotted oddity to find out what it really was.";
    const COLLECTION_COMPLETE = "🏆 You spotted every oddity! The party planners are very impressed.";

    // One tile per oddity: its icon if spotted this session, or "?" if not yet.
    function renderCollection() {
      document.getElementById("spotted-count").textContent = spottedThisSession.size;
      document.getElementById("oddity-total").textContent = ANOMALIES.length;

      const tiles = ANOMALIES.map((anomaly, index) => {
        const tile = document.createElement("li");
        tile.className = "oddity";
        tile.tabIndex = 0;  // lets keyboard users (and a tap on phones) select it
        tile.dataset.index = index;

        if (spottedThisSession.has(anomaly.name)) {
          const isNew = !spottedBeforeThisGame.has(anomaly.name);
          tile.textContent = anomaly.icon;
          tile.classList.toggle("is-new", isNew);
          // Screen readers get the name and the note straight away.
          tile.setAttribute("aria-label",
            `${anomaly.name}${isNew ? " (new)" : ""}: ${anomaly.note}`);
        } else {
          tile.textContent = "?";
          tile.classList.add("locked");
          tile.setAttribute("aria-label", "Not spotted yet");
        }
        return tile;
      });
      oddityGrid.replaceChildren(...tiles);

      oddityNote.textContent = spottedThisSession.size === ANOMALIES.length
        ? COLLECTION_COMPLETE
        : COLLECTION_HINT;
    }

    // Show the note for whichever tile the mouse, keyboard, or finger is on.
    function showOddityNote(tile) {
      oddityGrid.querySelectorAll(".selected").forEach((t) => t.classList.remove("selected"));
      tile.classList.add("selected");
      const anomaly = ANOMALIES[Number(tile.dataset.index)];
      oddityNote.textContent = tile.classList.contains("locked")
        ? "❓ Not spotted yet. Keep playing to find it!"
        : `${anomaly.icon} ${anomaly.name}: ${anomaly.note}`;
    }

    function showWinDialog(entry, result) {
      const pairCount = deck.length / 2;
      const stars = starsFor(entry.moves, pairCount);
      document.getElementById("star-icons").textContent =
        "★".repeat(stars) + "☆".repeat(3 - stars);
      document.getElementById("star-text").textContent = `${stars} of 3 stars`;

      document.getElementById("win-summary").textContent =
        `You found all ${pairCount} pairs in ${entry.moves} moves ` +
        `(${formatTime(entry.seconds)}) and scored ${entry.points} points.`;

      renderScoreTable(result);
      renderCollection();
      fillSpaceParty();
      winDialog.showModal();
    }

    function renderScoreTable({ list, rank, saved }) {
      document.getElementById("score-caption").textContent =
        `Your best scores: ${LEVEL.label}`;

      const rows = list.map((score, i) => {
        const row = document.createElement("tr");
        const isNew = i === rank;
        if (isNew) row.className = "new-score";
        const cells = [
          isNew ? `${i + 1} new!` : String(i + 1),
          score.moves,
          formatTime(score.seconds),
          score.points,
          THEMES[score.theme]?.label ?? "?",
        ];
        for (const value of cells) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        }
        return row;
      });
      document.getElementById("score-rows").replaceChildren(...rows);

      let note = "";
      if (rank === -1) note = `Not in your top ${MAX_SAVED_SCORES} this time. Try again!`;
      if (!saved) note += " (Scores can't be saved in this browser, so they reset when you close the page.)";
      document.getElementById("score-note").textContent = note.trim();
    }

    // ===== Event Handlers =====

    // One listener on the board handles every card ("event delegation").
    function handleCardClick(event) {
      const card = event.target.closest(".card");
      if (!card) return;  // clicked the gap between cards
      const index = Number(card.dataset.index);

      // Clicking during the pause flips the wrong pair back right away,
      // so fast players don't have to wait.
      if (isChecking) {
        const clickedWrongPair = revealed.includes(index);
        flipBackNow();
        if (clickedWrongPair) return;  // that click was just "hurry up"
      }

      // Ignore clicks that shouldn't count.
      if (matched.has(index) || revealed.includes(index)) return;

      startTimer();  // does nothing if the clock is already running
      revealed.push(index);
      updateCard(index);
      playSound("flip");

      if (revealed.length === 2) {
        checkForMatch();
      }
    }

    // Switching theme deals a new game right away, since the cards change.
    function handleThemeChange() {
      currentTheme = themeSelect.value;
      startNewGame();
    }

    function handleSoundToggle() {
      isMuted = !isMuted;
      saveMuted();
      updateSoundButton();
    }

    function handleOddityPointer(event) {
      const tile = event.target.closest(".oddity");
      if (tile) showOddityNote(tile);
    }

    function handlePlayAgain() {
      winDialog.close();
      startNewGame();
    }

    board.addEventListener("click", handleCardClick);
    themeSelect.addEventListener("change", handleThemeChange);
    soundButton.addEventListener("click", handleSoundToggle);
    document.getElementById("new-game").addEventListener("click", startNewGame);
    document.getElementById("play-again").addEventListener("click", handlePlayAgain);
    // Hover (mouse), focusin (keyboard), and click (tap on a phone, which can't hover).
    oddityGrid.addEventListener("mouseover", handleOddityPointer);
    oddityGrid.addEventListener("focusin", handleOddityPointer);
    oddityGrid.addEventListener("click", handleOddityPointer);
    // Closing the party with Esc should also start fresh, like Play Again.
    winDialog.addEventListener("cancel", startNewGame);

    // ===== Initialization =====
    themeSelect.value = currentTheme;
    updateSoundButton();
    startNewGame();
  </script>
</body>
</html>
